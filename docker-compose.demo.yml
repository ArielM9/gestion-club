services:
  postgres:
    image: postgres:16-alpine
    container_name: victorianos-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: victorianos_demo
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d victorianos_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - demo_net

  minio:
    image: minio/minio:latest
    container_name: victorianos-demo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: demo
      MINIO_ROOT_PASSWORD: demo123456
    command: server /data --console-address ":9001"
    volumes:
      - demo_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - demo_net

  minio-init:
    image: minio/mc:latest
    container_name: victorianos-demo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 demo demo123456 &&
      (mc mb --ignore-existing local/club-files) &&
      mc anonymous set download local/club-files &&
      echo '✅ MinIO bucket club-files ready'
      "
    networks:
      - demo_net
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: victorianos-demo-app
    restart: unless-stopped
    env_file:
      - .env.demo
    environment:
      DATABASE_URL: postgresql://demo:demo@postgres:5432/victorianos_demo
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: demo
      S3_SECRET_KEY: demo123456
      S3_BUCKET: club-files
      NEXT_PUBLIC_IS_DEMO: "true"
      BETTER_AUTH_URL: http://localhost:3007
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3007:3000"
    networks:
      - demo_net

volumes:
  demo_pg_data:
  demo_minio_data:

networks:
  demo_net:
    driver: bridge
